<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine · Initiative prioritization and Lean BuCA (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2F2D2D;--ink2:#716A6A;--bg:#fff;--bg2:#F8F6F6;--bg3:#F3F0F0;--green:#007250;--green-l:#84DC99;--green-t:#E8F5EE;--red:#E5384C;--orange:#EA714F;--dred:#A63B3C;--purple:#3E235B;--grad:linear-gradient(90deg,#E5384C,#EA714F);--sh:0 5px 10px rgba(26,23,27,.10);--sh2:0 10px 15px rgba(26,23,27,.05);--line:#E6E1E1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans","Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:24px}
h1,h2,h3,h4{margin:0;font-weight:700}
h1{font-size:40px;line-height:44px}h2{font-size:24px;line-height:28px}h3{font-size:20px;line-height:24px;font-weight:500}h4{font-size:16px;line-height:24px}
a{color:var(--green)}
button,select,input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.ann{background:var(--purple);color:#fff;font-size:14px;line-height:20px;padding:8px 0}
.ann b{font-weight:700}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none;color:var(--ink)}
.brand i{display:block;width:28px;height:28px;border-radius:0 10px 10px 0;background:var(--grad)}
.brand small{font-weight:400;color:var(--ink2);font-size:14px}
nav.main{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.main a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:16px;white-space:nowrap}
nav.main a:hover{background:var(--bg2)}
nav.main a.on{font-weight:700;box-shadow:inset 0 -4px 0 var(--green-l);border-radius:8px 8px 0 0}
.rolebox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.rolebox select{height:40px;border:1px solid var(--ink2);border-radius:9999px;padding:0 14px;background:#fff;font-size:14px;font-weight:700;color:var(--ink)}
main{padding:32px 0 80px}
.hero{background:var(--grad);color:#fff;border-radius:0 24px 24px 0;padding:28px 32px 28px 24px;margin-left:-24px;max-width:860px}
.hero p{margin:8px 0 0;font-size:18px;line-height:28px}
.hero .meta{font-size:14px;line-height:20px;opacity:.95;margin-bottom:6px}
.card{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:24px}
.muted{color:var(--ink2)}.small{font-size:14px;line-height:20px}.cap{font-size:12px;line-height:16px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:8px;border:2px solid var(--green);background:var(--green);color:#fff;font-size:18px;font-weight:400;cursor:pointer;text-decoration:none}
.btn:hover{background:#005c40;border-color:#005c40}
.btn.sec{background:#fff;color:var(--green)}.btn.sec:hover{background:var(--green-t)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--green);padding:8px 10px;min-height:40px;font-size:16px;text-decoration:underline;text-decoration-color:var(--green-l);text-decoration-thickness:4px;text-underline-offset:6px}
.btn.sm{min-height:40px;font-size:16px;padding:8px 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.stack>*+*{margin-top:16px}
label.f{display:block;font-size:14px;line-height:20px;font-weight:700;margin-bottom:4px}
label.f span{font-weight:400;color:var(--ink2)}
input.i,select.i,textarea.i{width:100%;min-height:48px;border:1px solid var(--ink2);border-radius:8px;padding:8px 16px;background:#fff}
textarea.i{min-height:88px;resize:vertical;line-height:24px}
input.i:focus,select.i:focus,textarea.i:focus,.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--green-l);outline-offset:1px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg .w{grid-column:1/-1}
.val{min-height:24px;white-space:pre-wrap}
.val.empty{color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:700;padding:4px 10px;border-radius:9999px;background:var(--bg3);color:var(--ink);white-space:nowrap}
.chip.g{background:var(--green-t);color:var(--green)}
.chip.r{background:#FBE7E9;color:var(--dred)}
.chip.a{background:#FDEFE6;color:#8A3B16}
.chip.p{background:#EEE9F4;color:var(--purple)}
.chip.o{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.stepper{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:24px 0}
.st{border-top:4px solid var(--bg3);padding-top:8px;font-size:14px;line-height:18px}
.st b{display:block;font-weight:700}.st span{color:var(--ink2);font-size:12px}
.st.done{border-color:var(--green)}.st.now{border-color:var(--orange)}
.st.now b{color:var(--dred)}
.art{border-radius:16px;box-shadow:var(--sh);background:#fff;overflow:hidden}
.art+.art{margin-top:12px}
.arth{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none}
.arth:hover{background:var(--bg2)}
.num{flex:none;width:32px;height:32px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid var(--bg3);color:var(--ink2)}
.art.done .num{background:var(--green);border-color:var(--green);color:#fff}
.art.now .num{border-color:var(--red);color:var(--red)}
.art.locked .arth{opacity:.6}
.arth .t{flex:1;min-width:0}
.arth .t b{display:block}
.arth .t span{font-size:14px;color:var(--ink2)}
.artb{padding:4px 20px 24px 66px;border-top:1px solid var(--bg3)}
.artb .lead{font-size:14px;color:var(--ink2);margin:12px 0 16px}
.chev{transition:transform .15s;color:var(--ink2)}
.open .chev{transform:rotate(90deg)}
.ai{background:var(--bg2);border-radius:16px;padding:16px 20px;margin-top:16px}
.ai h4{display:flex;align-items:center;gap:8px}
.ai ul{margin:8px 0 0;padding-left:20px}
.meter{height:8px;border-radius:9999px;background:var(--bg3);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--bg2);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:24px;line-height:28px}
.kpi span{font-size:14px;color:var(--ink2)}
.navlist{background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.navrow{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:72px;text-decoration:none;color:var(--ink);border-top:1px solid var(--bg3);cursor:pointer}
.navrow:first-child{border-top:0}
.navrow:hover{background:var(--bg2)}
.navrow .t{flex:1;min-width:0}.navrow .t b{display:block}.navrow .t span{font-size:14px;color:var(--ink2)}
.ico{flex:none;width:40px;height:40px;border-radius:9999px;border:1.5px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center}
.board{display:grid;grid-template-columns:repeat(8,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--bg2);border-radius:16px;padding:12px;min-height:320px}
.col h4{font-size:14px;line-height:20px}
.col h4 span{font-weight:400;color:var(--ink2)}
.bc{display:block;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px;margin-top:10px;text-decoration:none;color:var(--ink);font-size:14px;line-height:20px}
.bc:hover{box-shadow:0 0 0 2px var(--green-l),var(--sh)}
.bc b{display:block;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
table.t th{text-align:left;font-weight:700;color:var(--ink2);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 8px;border-bottom:1px solid var(--bg3);vertical-align:top}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:var(--bg2)}
.r{text-align:right}
.gate{list-style:none;padding:0;margin:12px 0;font-size:14px;line-height:20px}
.gate li{display:flex;gap:8px;padding:4px 0}
.gate li.ok{color:var(--green)}.gate li.no{color:var(--ink)}
.gate li.no::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border-radius:9999px;border:1.5px solid var(--ink2)}
.err{color:var(--dred);font-size:14px;margin-top:8px;min-height:20px}
.tl{font-size:14px;line-height:20px}
.tl li{padding:6px 0;border-top:1px solid var(--bg3);list-style:none}
.tl{padding:0;margin:0}
.tl time{color:var(--ink2);font-size:12px;margin-right:6px}
.bar{position:relative;height:28px;border-radius:8px;background:var(--bg3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c1{background:var(--green)}.bar .c2{background:var(--green-l)}
.bar .c3{background:repeating-linear-gradient(135deg,rgba(234,113,79,.55) 0 6px,rgba(234,113,79,.25) 6px 12px)}
.bar .over{background:repeating-linear-gradient(135deg,rgba(229,56,76,.85) 0 6px,rgba(229,56,76,.5) 6px 12px)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.check li{list-style:none;display:flex;gap:10px;padding:4px 0}
.check{padding:0;margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:var(--sh);font-size:16px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:40px 0 16px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--ink2);font-size:14px}
.idtag{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.02em;color:var(--ink2);background:var(--bg3);border-radius:4px;padding:2px 6px;margin-right:6px;vertical-align:1px}
.hero .idtag{background:rgba(255,255,255,.22);color:#fff}
.lib{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lchip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:9999px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh);cursor:grab;font-size:14px;color:var(--ink)}
.lchip svg{color:var(--red)}.lchip:hover{border-color:var(--green)}.lchip:active{cursor:grabbing}
.levers{border-radius:16px}.levers.dropz{border:2px dashed var(--line);padding:8px;min-height:64px;transition:border-color .15s,background .15s}
.levers.dropz.over,.icard.over,.dcard.over{border-color:var(--green);background:var(--green-t)}
.lever{background:var(--bg2);border-radius:12px;padding:12px 16px 16px}.lever+.lever{margin-top:8px}
.lvh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.lvh .t{flex:1;min-width:0}.lvh .t b{display:block;font-size:16px}.lvh .t span{font-size:14px;color:var(--ink2)}
.ico.sm{width:36px;height:36px;background:#fff}
.lvv{font-weight:700;white-space:nowrap}
.xbtn{flex:none;width:32px;height:32px;border-radius:9999px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:18px;line-height:1;cursor:pointer}
.xbtn:hover{border-color:var(--dred);color:var(--dred)}.xbtn.sm{width:22px;height:22px;font-size:14px;margin-left:4px}
.tri{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px;align-items:start}
.dcard,.icard{position:relative;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:16px;border:2px solid transparent;transition:border-color .15s,background .15s}
.dcard[draggable=true]{cursor:grab}.dcard.dragging{opacity:.45}
.icard .drophint{margin-top:10px;font-size:12px;line-height:16px;color:var(--ink2);border:1.5px dashed var(--line);border-radius:8px;padding:8px;text-align:center}
.cand{border-color:var(--orange)}
.simtag{position:absolute;top:-10px;right:12px;background:var(--orange);color:#fff;font-size:12px;line-height:16px;font-weight:700;padding:2px 8px;border-radius:9999px}
.grip{color:var(--ink2);letter-spacing:-3px;margin-right:8px;font-weight:700}
.bchip{display:inline-flex;align-items:center;background:var(--bg2);border-radius:9999px;padding:4px 6px 4px 8px;font-size:14px;line-height:20px}
.bchip a{color:var(--ink);text-decoration:none}.bchip .idtag{margin-right:6px}
@media (max-width:900px){.tri{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--bg3);border-radius:9999px;padding:4px;gap:4px}
.seg a{padding:8px 18px;border-radius:9999px;text-decoration:none;color:var(--ink);font-size:16px}
.seg a.on{background:#fff;box-shadow:var(--sh);font-weight:700}
.calwrap{overflow-x:auto;margin-top:16px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:8px 16px 16px}
.cal{min-width:960px}
.calrow{display:grid;grid-template-columns:300px 1fr;align-items:center;border-top:1px solid var(--bg3);min-height:60px;cursor:pointer;transition:opacity .15s,background .15s}
.calrow:not(.calhead):hover{background:var(--bg2)}
.calhead{border-top:0;min-height:36px;cursor:default}
.callab{padding:8px 12px 8px 4px;display:flex;flex-direction:column;min-width:0}
.callab .caltitle{font-weight:700;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calkey{text-decoration:none;line-height:16px}
.caltrack{position:relative;height:100%;min-height:44px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(300% / var(--n)) 100%}
.calhead .caltrack{background:none}
.qlab{position:absolute;top:8px;font-size:12px;line-height:16px;font-weight:700;color:var(--ink2);padding-left:6px;border-left:1px solid var(--line)}
.calbar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:0 8px 8px 0;font-size:12px;line-height:26px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.calbar.delivery{background:var(--green);color:#fff}.calbar.funded{background:var(--green-l);color:#0B4A35}
.calbar.estimate{background:repeating-linear-gradient(135deg,rgba(234,113,79,.45) 0 6px,rgba(234,113,79,.18) 6px 12px);color:#712B13;border:1px dashed var(--orange)}
.calbar.done{background:#D3D1C7;color:#444441}
.caltg{position:absolute;top:50%;transform:translate(-50%,-50%);color:var(--red);font-size:16px;line-height:1}
.todayl{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);opacity:.5}
.calrow.dim{opacity:.3}.calrow.sel{background:var(--green-t)}.calrow.rel{background:#FDEFE6}
.relcard{padding:8px 24px}
.relrow{display:grid;grid-template-columns:190px 1fr auto;grid-template-areas:"chip pair btn" "chip why btn";column-gap:16px;row-gap:2px;padding:14px 0;border-top:1px solid var(--bg3);align-items:start}
.relrow:first-child{border-top:0}
.relrow .chip{grid-area:chip;justify-self:start}.relpair{grid-area:pair}.relwhy{grid-area:why;color:var(--ink)}.relbtns{grid-area:btn;display:flex;gap:4px;align-items:center}
.relrow.cmp{grid-template-columns:1fr;grid-template-areas:"chip" "pair" "why";padding:10px 0}
@media (max-width:900px){.relrow{grid-template-columns:1fr;grid-template-areas:"chip" "pair" "why" "btn"}}
.nextcard{border-top:4px solid var(--orange);border-radius:0 0 16px 16px;background:linear-gradient(#FDF3EE,#FDF3EE)}
.nextwho{display:flex;flex-direction:column;gap:2px;margin-top:8px}.nextwho span:last-child{font-size:16px;line-height:24px}
.nextrole{font-size:20px;line-height:24px;font-weight:700}
.stl{text-decoration:none;color:var(--ink)}.stl:hover b{text-decoration:underline;text-decoration-color:var(--green-l);text-decoration-thickness:3px}
.hist li{padding:0;border-top:1px solid var(--bg3)}
.hist a{display:grid;grid-template-columns:auto 1fr;column-gap:6px;padding:8px 6px;margin:0 -6px;border-radius:8px;text-decoration:none;color:var(--ink)}
.hist a:hover{background:var(--bg2)}.hist time{grid-row:1;padding-top:1px}
.hist .hart{grid-column:2;font-size:12px;line-height:16px;font-weight:700;color:var(--green);margin-top:2px}
.art{scroll-margin-top:96px}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--orange),var(--sh)}100%{box-shadow:var(--sh)}}
.art.flash{animation:flash 2.2s ease-out}
@media (prefers-reduced-motion:reduce){.art.flash{animation:none;box-shadow:0 0 0 3px var(--orange),var(--sh)}}
.photobar{display:flex;gap:10px;align-items:flex-start;background:#EEE9F4;color:var(--purple);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:14px;line-height:20px}
.photobar svg{flex:none;margin-top:3px}.recalc{margin-top:10px;color:var(--ink)}
.costrow{display:grid;grid-template-columns:28px 1.1fr 1.4fr 1.1fr .9fr .8fr .8fr 32px;gap:10px;align-items:end;background:var(--bg2);border-radius:12px;padding:12px}
.costrow .cr-num{font-weight:700;color:var(--ink2);padding-bottom:12px}.costrow .xbtn{margin-bottom:8px}
.costrow input.i,.costrow select.i{min-height:40px;padding:6px 10px;font-size:14px}
@media (max-width:1100px){.costrow{grid-template-columns:1fr 1fr}.costrow .cr-num{grid-column:1/-1;padding:0}}
.ovrform{background:var(--bg2);border-radius:12px;padding:16px;margin:12px 0}
.chglog{list-style:none;padding:0;margin:8px 0}.chglog li{padding:8px 0;border-top:1px solid var(--bg3);font-size:14px;line-height:20px}.chglog li:first-child{border-top:0}
table.yrs td,table.yrs th{padding:8px}
table.cmp tr.grp td{background:var(--bg2);font-weight:700;font-size:12px;line-height:16px;color:var(--ink2)}
.ai.warn{background:#FDEFE6}
.rolehelp{font-size:14px;color:var(--green);font-weight:700;white-space:nowrap}
@keyframes pulse{0%,60%{box-shadow:0 0 0 4px var(--green-l)}100%{box-shadow:0 0 0 0 transparent}}
.rolebox select.pulse{animation:pulse 2.4s ease-out}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rolecard{display:flex;flex-direction:column;gap:14px;text-align:left;background:#fff;border:2px solid transparent;border-radius:16px;box-shadow:var(--sh);padding:20px 22px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,background .15s}
.rolecard:hover,.rolecard:focus-visible{border-color:var(--green);outline:none}.rolecard:focus-visible{box-shadow:0 0 0 4px var(--green-l),var(--sh)}
.rolecard.cur{background:var(--green-t)}
.rc-top{display:flex;align-items:center;gap:14px}.rc-name{flex:1;display:flex;flex-direction:column}.rc-name b{font-size:20px;line-height:24px}.rc-name span{font-size:14px;line-height:20px;color:var(--ink2)}
.rc-does{display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:22px}.rc-does>span{display:flex;gap:8px}.rc-dot{color:var(--green);flex:none;padding-top:2px}

@media (prefers-reduced-motion:reduce){.rolebox select.pulse{animation:none}}

 const id=curId(),i=item(id);if(!i)return;const R=S.role;ART_CTX=i.stage;setTimeout(()=>{ART_CTX=null},0);
 if(k==='addLever'){addLever(i,el.dataset.lever);return}
 if(k==='rmLever'){i.buca.levers.splice(+el.dataset.k,1);save(i);render();return}
 if(k==='addCost'){i.buca.costs=i.buca.costs||[];i.buca.costs.push({type:'licence',desc:'',term:'recurring',year:1,cls:'opex'});save(i);render();const e2=document.getElementById('f_buca_costs_'+(i.buca.costs.length-1)+'_desc');if(e2)e2.focus();return}
 if(k==='rmCost'){i.buca.costs.splice(+el.dataset.k,1);save(i);render();return}
 if(k==='override'){if(S.role!=='finance'||RO)return;const sel=val('ovrSel'),v=val('ovrVal').replace(',','.'),why=val('ovrWhy').trim();
  if(!sel)return formErr('ovrerr','Choose what to override.');if(!isNum(v))return formErr('ovrerr','Enter the new value as a number.');if(why.length<5)return formErr('ovrerr','Give a reason. It is logged with your name.');
  const nv=+v;let old,label;if(sel.startsWith('p:')){const pk=sel.slice(2);old=rulesFor(i)[pk];label='Parameter · '+PDEF[pk].l;i.buca.ovr[pk]=nv}else{const path=sel.slice(2);old=gp(i.buca,path);label=fieldLabel(i,path);sp(i.buca,path,nv)}
  i.buca.changes.push({at:Date.now(),by:ME||null,role:S.role,kind:'override',field:sel,label,old:old==null?'':old,new:nv,why});log(i,`Override: ${label} ${fmtVal(sel,old)} → ${fmtVal(sel,nv)} (${why})`,4);save(i,true);render();toast('Override applied and logged');return}
 if(k==='undoOvr'){if(S.role!=='finance'||RO)return;const pk=el.dataset.k;const old=i.buca.ovr[pk];delete i.buca.ovr[pk];const why=val('ovrWhy').trim()||'Override withdrawn';
  i.buca.changes.push({at:Date.now(),by:ME||null,role:S.role,kind:'withdrawn',field:'p:'+pk,label:'Parameter · '+PDEF[pk].l,old,new:rulesFor(i)[pk],why});log(i,`Override withdrawn: ${PDEF[pk].l} (${why})`,4);save(i,true);render();toast('Override withdrawn and logged');return}
 if(k==='recalc'){if(S.role!=='finance'||RO)return;const why=val('recalcWhy').trim();if(why.length<5)return formErr('recalcerr','Give a reason. It is logged with your name.');
  const before=calc(i),drift=driftOf(i),now=Date.now();i.buca.photo={at:now,by:ME||null,rules:paramsAt(now),prev:i.buca.photo&&i.buca.photo.at};const after=calc(i);
  i.buca.changes.push({at:now,by:ME||null,role:S.role,kind:'recalc',field:'net',label:'Net value after recalculating with '+drift.map(d=>d.l).join(', '),old:Math.round(before.net),new:Math.round(after.net),why});
  snapVersion(i,'Recalculated with today\'s parameters · new photo moment',why);log(i,`Recalculated with today's parameters as v${i.buca.versions.length}: net ${eur(before.net)} → ${eur(after.net)} (${why})`,4);save(i,true);render();toast('Recalculated. New photo moment saved.');return}
 const go=(stage,msg,text)=>{const from=i.stage;if(stage)i.stage=stage;log(i,text||msg,from);save(i,true);OPEN[id]=new Set([i.stage]);render();toast(msg);window.scrollTo({top:0,behavior:'smooth'})};
 switch(k){
 case 'aicheck':return aiCheck(i,el);
 case 'usekpi':i.outcome.kpi=KPI_HINT[i.demand.okr];save(i);render();return;
 case 'submit':if(!gateOk(1,i))return;i.status='active';if(!i.ai)await aiCheck(i,null,true);return go(2,'Submitted for triage','Demand record submitted');
 case 'accept':if(!gateOk(2,i))return;return go(3,'Accepted. The owner can now fill in the outcome card.','Accepted at triage, labelled '+i.overview.type);
 case 'sendback':{const r=needReason();if(!r)return;i.status='returned';return go(1,'Sent back to the owner','Sent back: '+r)}
 case 'decline':{const r=needReason();if(!r)return;i.status='declined';return go(0,'Declined','Declined: '+r)}
 case 'merge':{bundle(i.id,document.getElementById('mergeSel').value);return}
 case 'outcomeReady':if(!gateOk(3,i))return;i.outcome.ready=true;return go(0,'Sent to the portfolio lead for a check','Outcome card ready for check');
 case 'confirmOutcome':return go(4,'Outcome confirmed. The Lean BuCA is open.','Outcome card confirmed as measurable');
 case 'sendbackOutcome':{const r=needReason();if(!r)return;i.outcome.ready=false;return go(0,'Sent back to the owner','Outcome card sent back: '+r)}
 case 'confirmEffort':if(!(+i.buca.effort>0)||!i.buca.team)return errOut('Fill in effort and team in the Lean BuCA first.');i.buca.effortBy='cap';return go(0,'Effort confirmed','Effort confirmed: '+i.buca.effort+' FTE-months, '+(team(i.buca.team)||{}).n);
 case 'toFinance':{if(!gateOk(4,i))return;let note='';if(i.buca.fin==='returned'){note=needReason();if(!note)return}i.buca.fin='pending';snapVersion(i,'Sent to Business Control',note);return go(0,'Sent to Business Control as v'+i.buca.versions.length,'Lean BuCA v'+i.buca.versions.length+' sent to Business Control'+(note?': '+note:''))}
 case 'approve':{const r=((document.getElementById('reason')||{}).value||'').trim();if(r)i.buca.finNote=(i.buca.finNote?i.buca.finNote+'\n':'')+r;i.buca.fin='approved';const now=Date.now();i.buca.photo={at:now,by:ME||null,rules:paramsAt(now)};snapVersion(i,'Approved by Business Control · photo moment',r);return go(5,'Approved and frozen. It is now on the decision agenda.','Lean BuCA approved as v'+i.buca.versions.length+', parameters frozen (photo moment)'+(r?': '+r:''))}
 case 'returnBuca':{const r=needReason();if(!r)return;i.buca.fin='returned';i.buca.finNote=r;snapVersion(i,'Returned by Business Control',r);return go(0,'Returned to the owner with questions','Lean BuCA v'+i.buca.versions.length+' returned: '+r)}
 case 'fund':case 'prove':case 'queue':case 'stop':{const r=needReason();if(!r)return;const v={fund:'Fund',prove:'Prove first',queue:'Queue',stop:'Stop'}[k];const c=(document.getElementById('cond')||{}).value||'';
  i.decisions.push({verdict:v,reason:r,conditions:c.trim(),role:'heads',at:Date.now(),cycle:S.cycle});
  if(k==='queue'){i.status='queued';return go(0,'Queued for a later cycle',v+': '+r)}if(k==='stop'){i.status='stopped';return go(0,'Stopped',v+': '+r)}
  i.status='active';i.capacity.team=i.capacity.team||i.buca.team;return go(6,v+'. Capability leads can now commit capacity.',v+': '+r+(c.trim()?' (conditions: '+c.trim()+')':''))}
 case 'commit':if(!gateOk(6,i))return;{const c=i.capacity;return go(7,'Capacity committed','Capacity committed: '+(team(c.team)||{}).n+', '+c.fte+' FTE, '+c.startQ+' to '+c.endQ)}
 case 'flagRed':{const r=needReason();if(!r)return;i.capacity.rag='red';return go(0,'Flagged. The Heads see it in the history.','Flagged as not deliverable now: '+r)}
 case 'gen':{const o=i.outcome;i.delivery={generated:true,epic:i.title,ac:`${o.kpi} moves from ${o.baseline} to ${o.target} by ${o.targetDate}, measured as: ${o.method}`,features:['Measurement setup: baseline report in Power BI',`Build: ${i.title}`,'Rollout and adoption','Benefit tracking against the Lean BuCA']};log(i,'Delivery structure generated');save(i);render();return}
 case 'push':if(!i.delivery.generated)return;i.delivery.pushed=true;i.delivery.adoId='ADO-'+(48000+Math.floor(Math.random()*999));return go(0,'Pushed to ADO (simulated)','Pushed to Aha/ADO as '+i.delivery.adoId);
 case 'delivered':if(!gateOk(7,i))return;return go(8,'Delivered. Time to close the loop.','Marked delivered');
 case 'submitActuals':if(!gateOk(8,i))return;i.review.submitted=true;return go(0,'Actuals submitted','Actuals submitted');
 case 'valueOk':i.review.valueOk=true;return go(0,'Realised value confirmed','Realised value confirmed');
 case 'kept':case 'partly':case 'notkept':{const v={kept:'Promise kept',partly:'Partly kept',notkept:'Not kept'}[k];let r='';if(k!=='kept'){r=needReason();if(!r)return}else r=((document.getElementById('reason')||{}).value||'').trim();
  i.review.verdict=v;i.review.verdictNote=r;i.status='closed';return go(0,'Closed: '+v,'Closed: '+v+(r?' · '+r:''))}
 case 'copyjson':try{await navigator.clipboard.writeText(document.getElementById('json').textContent);toast('Copied')}catch(e){toast('Select the text and copy it')}return;
 }}

/* ---------- AI check ---------- */
function ruleCheck(i){const d=i.demand,txt=(i.title+' '+(d.problem||'')+' '+(d.affected||'')).toLowerCase();let q=20;
 if((d.problem||'').length>80)q+=25;else if((d.problem||'').length>40)q+=12;if(/\d/.test(d.frequency||''))q+=20;else if(d.frequency)q+=8;if(d.affected)q+=15;if(d.whyNow)q+=10;if(/\d/.test(d.problem||''))q+=10;q=Math.min(q,100);
 const sc=S.okrs.map(o=>({o,n:o.kw.split(' ').filter(w=>txt.includes(w)).length})).sort((a,b)=>b.n-a.n);const chosen=okr(d.okr);const cn=chosen?(sc.find(x=>x.o.id===chosen.id)||{n:0}).n:0;
 let fit=chosen?Math.min(45+cn*15,92):20;const flags=[];if(!/\d/.test(d.frequency||''))flags.push('Add a number for how often it happens');if(chosen&&cn===0&&sc[0].n>0)flags.push(`The text fits "${sc[0].o.t}" better than the chosen OKR`);if((d.problem||'').length<80)flags.push('Say what the problem causes: contacts, cost or customer effort');
 if(/\b[A-Z][a-z]+ [A-Z][a-z]+\b/.test(d.problem||'')&&/\d{6,}/.test(d.problem||''))flags.push('Looks like it may contain customer details. Remove them.');
 const type=/automat|ai|agent|new|online|app|self-service/.test(txt)?'Change':/fix|repeat|error|transfer|route|reminder/.test(txt)?'CI':'CI';
 return {quality:q,fit,okr:chosen?chosen.id:(sc[0].n?sc[0].o.id:''),type,flags:flags.slice(0,4),summary:'',by:'rules'}}
let samplerP=null;function sampler(){if(!samplerP)samplerP=(window.claude&&window.claude.use?window.claude.use('sample').catch(()=>null):Promise.resolve(null));return samplerP}
async function aiCheck(i,btn,silent){const errEl=document.getElementById('aierr');if(btn){btn.disabled=true;btn.textContent='Checking…'}
 let res=null;try{const s=await Promise.race([sampler(),new Promise(r=>setTimeout(()=>r(null),4000))]);
  if(s){const p=`You check demand records for a Customer Services investment portfolio at an energy company. Score the record and reply with JSON only, no prose.
OKRs: ${S.okrs.map(o=>o.id+' = '+o.t).join('; ')}
Demand record:
Name: ${i.title}
Source: ${i.demand.source}
Problem: ${i.demand.problem}
Who is affected: ${i.demand.affected}
How often: ${i.demand.frequency}
Chosen OKR: ${(okr(i.demand.okr)||{}).t||'none'}
Why now: ${i.demand.whyNow||''}
Return {"quality":0-100 (clarity and evidence of the problem, NOT its value),"fit":0-100 (how directly it serves the chosen OKR),"okr":"best OKR id","type":"Run"|"CI"|"Change","flags":[up to 4 short, specific improvement tips, plain English, mention if customer-identifying details appear],"summary":"the initiative in one plain sentence"}`;
   const v=await s.json(p,{modelTier:'quick'});if(v&&typeof v.quality==='number'){res={quality:Math.max(0,Math.min(100,Math.round(v.quality))),fit:Math.max(0,Math.min(100,Math.round(v.fit||0))),okr:v.okr||i.demand.okr,type:['Run','CI','Change'].includes(v.type)?v.type:'CI',flags:(v.flags||[]).slice(0,4).map(String),summary:String(v.summary||''),by:'claude'}}}}
 catch(e){if(errEl&&!silent)errEl.textContent=e&&e.code==='rate_limited'?'Claude is busy; used the rule-based check instead.':''}
 if(!res)res=ruleCheck(i);i.ai=res;if(!i.overview.type&&res.type)i.overview.type=res.type;save(i);if(!silent){render();toast(res.by==='claude'?'Checked by Claude':'Checked with the rule-based check')}}
init();
</script>
